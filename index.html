<style>
/* Una columna estrecha tipo hoja de dorsales; la cinta de balizamiento es el único acento */
:root{
  --bg:#eceee8; --surface:#f8f9f5; --ink:#1b201a; --muted:#5d6559; --line:#cfd4c9;
  --tape:#f2c200; --tape-ink:#1b201a; --mud:#6b5a43; --grass:#2f6b3d;
  --ok:#2f6b3d; --warn:#9a6a00; --bad:#a23b2c;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141812; --surface:#1c211a; --ink:#e7eae2; --muted:#9aa394; --line:#2f362c;
  --tape:#f2c200; --tape-ink:#141812; --mud:#b39a77; --grass:#6fbf80;
  --ok:#6fbf80; --warn:#e2b04a; --bad:#e07a68; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding:0 16px;padding-block:env(safe-area-inset-top,0px) calc(48px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:720px;margin:0 auto}
[hidden]{display:none!important}
header{padding-block:22px 6px}
.tape{height:10px;background:repeating-linear-gradient(-45deg,var(--tape) 0 14px,var(--tape-ink) 14px 28px);border-radius:2px;margin-bottom:16px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,8vw,3.2rem);line-height:.95;letter-spacing:.01em;text-transform:uppercase;margin:0}
.sub{color:var(--muted);margin:6px 0 0}
.userbox{font-size:13px;color:var(--muted);text-align:right}
.userbox strong{color:var(--ink)}
nav{display:flex;gap:6px;margin:18px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav button{font:600 14px var(--body);background:none;border:0;color:var(--muted);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tape)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--grass);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.race-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.race-name{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1;text-transform:uppercase;margin:0}
.meta{color:var(--muted);font-size:13px;margin-top:4px}
.chip{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.chip.open{color:var(--ok)} .chip.closed{color:var(--warn)} .chip.done{color:var(--muted)}
.cls{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mud);border:1px solid var(--line);border-radius:3px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
@media (max-width:560px){.cats{grid-template-columns:1fr}}
.cat{min-width:0}
.cat h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.pos{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:8px;margin-bottom:6px}
.pos label{font-size:12px;font-weight:700;color:var(--muted)}
.pos label.win{color:var(--ink)}
input[type=text],input[type=email],input[type=password],input[type=datetime-local],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.btn{font:700 14px var(--body);background:var(--tape);color:var(--tape-ink);border:0;border-radius:4px;padding:9px 16px;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.note{font-size:13px;color:var(--muted)}
.note.ok{color:var(--ok)} .note.err{color:var(--bad)}
.lst{list-style:none;padding:0;margin:0;font-size:14px}
.lst li{display:flex;gap:8px;align-items:baseline;padding:2px 0}
.lst .tag{font-size:11px;font-weight:700;color:var(--muted);width:62px;flex:none;text-transform:uppercase;letter-spacing:.04em}
.lst .nm{flex:1;min-width:0}
.lst .r{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
.hit{color:var(--ok);font-weight:700}
.pts{font-family:var(--display);font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums}
details{margin-top:12px} summary{cursor:pointer;font-weight:600;font-size:14px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right}
td.rank{font-family:var(--display);font-weight:800;font-size:1.2rem;width:36px}
tr.me td{background:color-mix(in srgb,var(--tape) 18%,transparent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}
.seg button{font:600 13px var(--body);background:none;border:0;padding:8px 12px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.banner{background:var(--surface);border:1px dashed var(--mud);border-radius:6px;padding:14px 16px}
.empty{color:var(--muted);text-align:center;padding:28px 12px}
.rules{font-size:13px;color:var(--muted);margin-top:20px}
.auth{max-width:420px}
.field{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.field label{font-size:13px;font-weight:600}
.admrow{display:grid;grid-template-columns:1fr 190px 90px auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.admrow:last-child{border-bottom:0}
@media (max-width:640px){.admrow{grid-template-columns:1fr 1fr}.admrow .nmcol{grid-column:1/-1}}
h2.sec{font-size:13px;margin:6px 0 0;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
/* Sugerencias de corredores */
.ac{position:absolute;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px color-mix(in srgb,var(--ink) 18%,transparent);
  max-height:min(260px,45vh);overflow-y:auto;padding:4px 0;margin:0;list-style:none;-webkit-overflow-scrolling:touch}
.ac li{padding:10px 12px;cursor:pointer;font-size:15px;line-height:1.25}
.ac li[aria-selected="true"],.ac li:hover{background:color-mix(in srgb,var(--tape) 25%,transparent)}
.ac li b{font-weight:700}
.ac .none{color:var(--muted);cursor:default;font-size:13px}
.ac .none:hover{background:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="tape" aria-hidden="true"></div>
    <div class="top">
      <div>
        <h1>Copa Ciclocross</h1>
        <p class="sub">Elige ganador, 2ª y 3ª elección en élite masculina y femenina.</p>
      </div>
      <div class="userbox" id="userbox"></div>
    </div>
  </header>

  <main id="app"><div class="empty">Cargando…</div></main>

  <p class="rules" id="rules"></p>
  <datalist id="dl-h"></datalist>
  <datalist id="dl-m"></datalist>
</div>

<script>
// =====================================================================
// CONFIGURACIÓN: pega aquí los datos de tu proyecto de Supabase
// (Supabase > Project Settings > API: "Project URL" y la clave "anon public")
// =====================================================================
const SUPABASE_URL = "https://qvmdetlprlnfjqshwsou.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Qmj-8kEz7SroCVmXyI61VQ_-JT241lH";

// Tu Excel de Google Drive (debe estar compartido: cualquiera con el enlace puede ver)
const SHEET_ID = "1-Y2Gc2UGvUT-5t3-DIV-jiSEJ0H-UxmMu9y8PTlBM28";
const TABS = { carreras: "Carreras", corredores: ["Juego", "Corredores"],   // corredores que se pueden elegir (la primera que exista)
  h: ["Histórico 26-27 M", "Resultados_H"],   // élite masculina (se usa la primera que exista)
  m: ["Histórico 26-27 F", "Resultados_M"] };  // élite femenina
const SEASON = "2026-27";
const WINNER_BONUS = 0.10;   // +10 % si tu elección de ganador gana
// =====================================================================

const CATS = [{k:"h", label:"Élite masculina", dl:"dl-h"}, {k:"m", label:"Élite femenina", dl:"dl-m"}];
const SLOTS = ["Ganador","2ª elección","3ª elección"];
const CLASSES = ["CDM","CM","CE","C1","C2"];

document.getElementById("rules").textContent =
  "Cada corredor que eliges suma los puntos UCI de la posición en la que acaba. Si tu elección de ganador gana, sus puntos llevan un +10 %. " +
  "Puedes cambiar tu pronóstico hasta la hora de cierre; cuenta el último guardado. En caso de empate, va delante quien guardó antes su pronóstico. " +
  "Para entrar en la clasificación de % de ganadores hay que haber jugado al menos la mitad de las carreras disputadas.";

const configured = !SUPABASE_URL.startsWith("PEGA");
const sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const S = {
  session:null, profile:null, profiles:{}, races:[], picks:[], scales:{},
  riders:{h:[], m:[]}, riderSet:{h:new Set(), m:new Set()},
  results:{},            // raceId -> {h: Map(oficial->pos), m: Map, hRows:[], mRows:[]}
  unmatched:[], sheetErrors:[], tab:"carreras", clasif:"copa", authMode:"login",
  openDetails:new Set(), loaded:false
};

// ---------- utilidades ----------
const norm = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();
const fmtDT = iso => iso ? new Date(iso).toLocaleString("es-ES",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "";
const fmtDay = ymd => ymd ? new Date(ymd+"T12:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"}) : "";
const toLocalInput = iso => { if(!iso) return ""; const d=new Date(iso); const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
const round1 = x => Math.round(x*10)/10;
const fmtPts = x => (Math.round(x*10)/10).toLocaleString("es-ES");
function h(tag, attrs={}, ...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false) continue;
    if(k==="class") el.className=v; else if(k==="text") el.textContent=v;
    else if(k.startsWith("on")) el.addEventListener(k.slice(2),v);
    else el.setAttribute(k, v===true?"":v);
  }
  for(const kid of kids.flat()){ if(kid==null||kid===false) continue; el.append(kid.nodeType?kid:document.createTextNode(String(kid))); }
  return el;
}

// ---------- lectura del Excel (Google Visualization, JSONP) ----------
let jsonpN=0;
function readTab(tab){
  return new Promise((resolve,reject)=>{
    const cb="__gviz"+(++jsonpN);
    const s=document.createElement("script");
    const timer=setTimeout(()=>{ cleanup(); reject(new Error("timeout")); },20000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb]=resp=>{ cleanup();
      if(resp.status==="error"){ reject(new Error(resp.errors?.[0]?.detailed_message||"error")); return; }
      const cols=resp.table.cols.map(c=>(c.label||"").trim());
      const rows=resp.table.rows.map(r=>(r.c||[]).map(c=>{ if(!c) return ""; const v=(c.f!=null && typeof c.v!=="string")?c.f:c.v; return v==null?"":String(v).trim(); }));
      resolve({cols, rows});
    };
    s.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}&headers=1&sheet=${encodeURIComponent(tab)}&_=${Date.now()}`;
    s.onerror=()=>{ cleanup(); reject(new Error("network")); };
    document.head.append(s);
  });
}
const colIdx = (cols, re, fallback) => { const i=cols.findIndex(c=>re.test(c)); return i>=0?i:fallback; };

async function loadSheet(){
  S.sheetErrors=[];
  const firstResults = async names => {
    for(const n of names){ try{ const t=await readTab(n); if(t.cols.some(c=>/ID_Carrera/i.test(c))) return t; }catch(e){} }
    throw new Error("no encontrada");
  };
  const firstRiders = async names => {
    for(const n of names){ try{ const t=await readTab(n); if(t.cols.some(c=>/oficial/i.test(c)) && t.cols.some(c=>/categor/i.test(c))) return t; }catch(e){} }
    throw new Error("no encontrada");
  };
  const [cor, rh, rm] = await Promise.allSettled([firstRiders(TABS.corredores), firstResults(TABS.h), firstResults(TABS.m)]);
  // Corredores
  if(cor.status==="fulfilled" && cor.value.cols.some(c=>/oficial/i.test(c)) && cor.value.cols.some(c=>/categor/i.test(c))){
    const {cols,rows}=cor.value; const io=colIdx(cols,/oficial/i,1), ic=colIdx(cols,/categor/i,2);
    const sets={h:new Set(), m:new Set()};
    for(const r of rows){ const n=r[io], c=(r[ic]||"").toUpperCase(); if(!n) continue; if(c.startsWith("H")) sets.h.add(n); else if(c.startsWith("M")) sets.m.add(n); }
    S.riders={h:[...sets.h].sort((a,b)=>a.localeCompare(b)), m:[...sets.m].sort((a,b)=>a.localeCompare(b))};
    S.riderSet={h:new Set(S.riders.h.map(norm)), m:new Set(S.riders.m.map(norm))};
  } else S.sheetErrors.push(`No he podido leer la lista de corredores (busco "${TABS.corredores.join('" o "')}").`);
  // Resultados
  S.results={}; S.unmatched=[];
  for(const [k,res] of [["h",rh],["m",rm]]){
    if(res.status!=="fulfilled" || !res.value.cols.some(c=>/ID_Carrera/i.test(c))){ S.sheetErrors.push(`No encuentro la pestaña de resultados ${k==="h"?"masculinos":"femeninos"} (busco "${TABS[k].join('" o "')}").`); continue; }
    const {cols,rows}=res.value;
    const ip=colIdx(cols,/^posici/i,0), iw=colIdx(cols,/corredor/i,1), ir=colIdx(cols,/ID_Carrera/i,5), io=colIdx(cols,/oficial/i,6);
    for(const r of rows){
      const race=r[ir]; if(!race) continue;
      const pos=parseInt(r[ip],10); const official=r[io]; const web=r[iw];
      const R = S.results[race] ||= {h:new Map(), m:new Map(), hRows:[], mRows:[]};
      R[k+"Rows"].push({pos:isNaN(pos)?null:pos, label:r[ip], name: (official && !/sin equivalencia/i.test(official)) ? official : web});
      if(!official || /sin equivalencia/i.test(official)){ if(web) S.unmatched.push({race, cat:k, name:web}); continue; }
      if(!isNaN(pos) && !R[k].has(norm(official))) R[k].set(norm(official), pos);
    }
  }
  for(const R of Object.values(S.results)) for(const k of ["h","m"]) R[k+"Rows"].sort((a,b)=>(a.pos??9999)-(b.pos??9999));
}

// ---------- puntuación ----------
const hasResult = raceId => { const R=S.results[raceId]; return !!R && (R.h.size>0 || R.m.size>0); };
const scaleFor = cls => S.scales[cls] || [];
function riderPoints(name, cat, race){
  const R=S.results[race.id]; if(!R||!name) return {pos:null, pts:0};
  const pos=R[cat].get(norm(name)); if(!pos) return {pos:null, pts:0};
  return {pos, pts: scaleFor(race.uci_class)[pos-1] || 0};
}
function pickScore(p, race){
  let total=0; const detail={h:[],m:[]};
  for(const c of CATS){
    (p[c.k]||[]).forEach((name,i)=>{
      const r=riderPoints(name,c.k,race); let pts=r.pts;
      const bonus = (i===0 && r.pos===1) ? pts*WINNER_BONUS : 0;
      total+=pts+bonus; detail[c.k][i]={name, pos:r.pos, pts:round1(pts+bonus), bonus:bonus>0};
    });
  }
  return {total:round1(total), detail};
}
const played = p => p && CATS.some(c=>(p[c.k]||[]).some(x=>norm(x)));
const pickOf = (uid, raceId) => S.picks.find(p=>p.user_id===uid && p.race_id===raceId) || null;
const isOpen = r => r.active && r.deadline && Date.now() < new Date(r.deadline).getTime();

function standings(filter=()=>true){
  const done=S.races.filter(r=>r.active && hasResult(r.id) && filter(r));
  const minRaces=Math.ceil(done.length/2);
  const last=[...done].sort((a,b)=>(b.race_date||"").localeCompare(a.race_date||"")||(b.deadline||"").localeCompare(a.deadline||""))[0];
  const rows=Object.values(S.profiles).map(pr=>{
    let pts=0,n=0,hit=0,att=0;
    for(const r of done){
      const p=pickOf(pr.id,r.id); if(!played(p)) continue;
      n++; pts+=pickScore(p,r).total;
      for(const c of CATS){ const g=(p[c.k]||[])[0]; const R=S.results[r.id];
        if(g && R[c.k].size){ att++; if(R[c.k].get(norm(g))===1) hit++; } }
    }
    // desempate: quien guardó antes su pronóstico de la última carrera disputada (sin pronóstico, detrás)
    const lp=last?pickOf(pr.id,last.id):null;
    const tie=(lp && played(lp) && lp.updated_at) ? new Date(lp.updated_at).getTime() : Infinity;
    return {uid:pr.id, name:pr.alias, pts:round1(pts), n, hit, att, pct:att?hit/att:0, tie};
  });
  return {done, minRaces, rows};
}

// ---------- carga de datos ----------
async function loadDb(){
  const [pr, ra, pk, st] = await Promise.all([
    sb.from("profiles").select("id,alias,is_admin,created_at"),
    sb.from("races").select("*").order("race_date"),
    sb.from("picks").select("*"),
    sb.from("settings").select("*").eq("key","uci_scales").maybeSingle()
  ]);
  if(pr.error||ra.error||pk.error) throw (pr.error||ra.error||pk.error);
  S.profiles=Object.fromEntries(pr.data.map(p=>[p.id,p]));
  S.profile=S.profiles[S.session.user.id]||null;
  S.races=ra.data; S.picks=pk.data; S.scales=st.data?.value||{};
  S.requests=[];
  if(S.profile?.is_admin){
    const {data}=await sb.from("reset_requests").select("*").eq("done",false).order("created_at");
    S.requests=data||[];
  }
}
async function refresh(){
  try{ await Promise.all([loadDb(), loadSheet()]); }
  catch(e){ console.error(e); S.sheetErrors.push("Error al cargar los datos: "+(e.message||e)); }
  S.loaded=true; render();
}

// ---------- render ----------
const dirty={};
document.addEventListener("input",e=>{ if(e.target.id) dirty[e.target.id]=e.target.value; });
const clearDirty=prefix=>{ for(const k of Object.keys(dirty)) if(k.startsWith(prefix)) delete dirty[k]; };

function render(){
  const f=document.activeElement, fid=f?.id;
  paint();
  for(const [id,v] of Object.entries(dirty)){ const el=document.getElementById(id); if(el && "value" in el && el.type!=="checkbox") el.value=v; }
  if(fid){ const el=document.getElementById(fid); if(el && el!==document.activeElement) el.focus(); }
}

function paint(){
  acClose();
  for(const [id,list] of [["dl-h",S.riders.h],["dl-m",S.riders.m]]) document.getElementById(id).replaceChildren(...list.map(n=>h("option",{value:n})));
  const app=document.getElementById("app"); app.replaceChildren();
  const ub=document.getElementById("userbox"); ub.replaceChildren();
  if(!configured){ app.append(h("div",{class:"banner"},"Falta configurar la conexión con Supabase. Sigue los pasos del archivo README.")); return; }
  if(!S.session){ app.append(authView()); return; }
  if(!S.loaded){ app.append(h("div",{class:"empty"},"Cargando carreras y resultados…")); return; }
  ub.append("Juegas como ", h("strong",{text:S.profile?.alias||"…"}), h("br"),
    h("span",{style:"display:inline-flex;gap:6px;margin-top:4px"},
      h("button",{class:"btn ghost small",onclick:()=>{S.showPass=!S.showPass;render();}},"Contraseña"),
      h("button",{class:"btn ghost small",onclick:async()=>{ await sb.auth.signOut(); }},"Salir")));
  if(S.showPass) app.append(passwordCard());

  const tabs=[["carreras","Carreras"],["clasif","Clasificaciones"]];
  if(S.profile?.is_admin) tabs.push(["admin", (S.requests||[]).length ? `Organizar (${S.requests.length})` : "Organizar"]);
  if(!tabs.some(t=>t[0]===S.tab)) S.tab="carreras";
  app.append(h("nav",{role:"tablist"}, tabs.map(([k,l])=>h("button",{role:"tab","aria-selected":String(S.tab===k),onclick:()=>{S.tab=k;try{localStorage.setItem("cc-tab",k);}catch(e){} render();}},l))));

function renderRaces(box){
  const races=S.races.filter(r=>r.active);
  if(!races.length){ box.append(h("div",{class:"card empty"},"Todavía no hay carreras.")); return; }
  const upcoming=races.filter(r=>!hasResult(r.id)).sort((a,b)=>(a.deadline||"").localeCompare(b.deadline||""));
  const past=races.filter(r=>hasResult(r.id)).sort((a,b)=>b.race_date.localeCompare(a.race_date));

  if(open.length){
    box.append(h("h2",{class:"sec"},"Abiertas"));
    open.slice(0,4).forEach(r=>box.append(raceCard(r)));
    if(open.length>4){
      const rest=h("details",{open:S.openDetails.has("__more"),ontoggle:e=>{e.currentTarget.open?S.openDetails.add("__more"):S.openDetails.delete("__more");}},
        h("summary",{},`Ver las ${open.length-4} carreras siguientes`), h("div",{class:"stack",style:"margin-top:12px"}, open.slice(4).map(raceCard)));

    }

function raceCard(r){
  const open=isOpen(r), done=hasResult(r.id);

      chip));
  const mine=pickOf(S.session.user.id, r.id);

  if(open){
    const ids={};
    card.append(h("div",{class:"cats"}, CATS.map(c=>h("div",{class:"cat"}, h("h3",{},c.label),
      SLOTS.map((slot,i)=>{ const id=`p-${r.id}-${c.k}-${i}`.replace(/[^\w-]/g,"_"); ids[c.k+i]=id;
        return h("div",{class:"pos"}, h("label",{for:id,class:i===0?"win":null},slot),

    const btn=h("button",{class:"btn",onclick:async()=>{
      msg.className="note err";

      const entry={};
      for(const c of CATS){
        const vals=SLOTS.map((_,i)=>document.getElementById(ids[c.k+i]).value.trim());
        for(const v of vals) if(v && S.riderSet[c.k].size && !S.riderSet[c.k].has(norm(v))){ msg.textContent=`"${v}" no está en la lista de ${c.label.toLowerCase()}. Elígelo de las sugerencias.`; return; }
        const filled=vals.filter(Boolean).map(norm);

        // guarda con el nombre oficial exacto de la lista

      }

      btn.disabled=true; msg.className="note"; msg.textContent="Guardando…";
      const row={user_id:S.session.user.id, race_id:r.id, h:entry.h, m:entry.m, updated_at:new Date().toISOString()};
      const {error}=await sb.from("picks").upsert(row);

      S.picks=S.picks.filter(p=>!(p.user_id===row.user_id && p.race_id===r.id)).concat(row);
      clearDirty(`p-${r.id}`.replace(/[^\w-]/g,"_"));
      msg.className="note ok"; msg.textContent="Guardado. Puedes cambiarlo hasta el cierre.";
    }}, mine?"Actualizar pronóstico":"Guardar pronóstico");
    card.append(h("div",{class:"row"}, btn, msg));

  }

  // Cerrada
  if(mine && played(mine)) card.append(myPicks(mine, r));

        h("tbody",{}, rows.map(x=>h("tr",{class:x.p.user_id===S.session.user.id?"me":null}, h("td",{text:x.name}),
          ...CATS.map(c=>h("td",{style:"font-size:13px"}, (x.p[c.k]||[]).flatMap((n,i)=>{ const d=x.s.detail[c.k][i];

          done?h("td",{class:"num pts"},fmtPts(x.s.total)):null)))))));

const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const monthLabel=ym=>{ const [y,m]=ym.split("-").map(Number); return MESES[m-1]+" "+y; };
function ptsTable(rows){
  const list=rows.filter(x=>x.n>0).sort((a,b)=>b.pts-a.pts||a.tie-b.tie||a.name.localeCompare(b.name));
  return table(["","Jugador",{t:"Carreras",num:1},{t:"Puntos",num:1}], list, null, (x,rk)=>[h("td",{class:"rank"},rk),h("td",{text:x.name}),h("td",{class:"num"},String(x.n)),h("td",{class:"num pts"},fmtPts(x.pts))]);
}
function pctTables(rows, minRaces, label){
  const out=[h("p",{class:"note",style:"margin:0"}, `Mínimo para entrar: ${minRaces} ${minRaces===1?"carrera jugada":"carreras jugadas"} (la mitad de las disputadas${label}).`)];
  const ok=x=>x.n>=minRaces && x.att>0;
  const qual=rows.filter(ok).sort((a,b)=>b.pct-a.pct||b.hit-a.hit||a.tie-b.tie||a.name.localeCompare(b.name));
  const rest=rows.filter(x=>x.n>0 && !ok(x)).sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name));
  const cols=["","Jugador",{t:"Carreras",num:1},{t:"Aciertos",num:1},{t:"%",num:1}];
  out.push(table(cols, qual, null, (x,rk)=>[h("td",{class:"rank"},rk),h("td",{text:x.name}),h("td",{class:"num"},String(x.n)),h("td",{class:"num"},`${x.hit}/${x.att}`),h("td",{class:"num pts"},Math.round(x.pct*100)+"%")]));
  if(rest.length){ out.push(h("h2",{class:"sec"},"Aún sin el mínimo de carreras"));
    out.push(table(cols, rest, null, x=>[h("td",{class:"rank"},"–"),h("td",{text:x.name}),h("td",{class:"num"},String(x.n)),h("td",{class:"num"},`${x.hit}/${x.att}`),h("td",{class:"num"},x.att?Math.round(x.pct*100)+"%":"—")])); }
  return out;
}
const countLine=n=>h("p",{class:"note",style:"margin:0"}, `${n} ${n===1?"carrera disputada":"carreras disputadas"}`);

function renderClasif(box){
  const views=[["copa","Copa Ciclocross"],["pct","% de ganadores"],["mes","Por meses"],["cdm","Copa del Mundo"]];
  box.append(h("div",{class:"seg",role:"group","aria-label":"Clasificación",style:"flex-wrap:wrap"},
    views.map(([k,l])=>h("button",{"aria-pressed":String(S.clasif===k),onclick:()=>{S.clasif=k;render();}},l))));
  const all=standings();
  if(!all.done.length){ box.append(h("div",{class:"card empty"},"La clasificación aparecerá con los resultados de la primera carrera.")); return; }

  if(S.clasif==="copa"){ box.append(countLine(all.done.length), ptsTable(all.rows)); return; }
  if(S.clasif==="pct"){ box.append(countLine(all.done.length), ...pctTables(all.rows, all.minRaces, "")); return; }

  if(S.clasif==="cdm"){
    const cdm=standings(r=>r.series==="Copa del Mundo");
    const total=S.races.filter(r=>r.active && r.series==="Copa del Mundo").length;
    box.append(h("p",{class:"note",style:"margin:0"}, `Suma de los puntos de las pruebas de la Copa del Mundo: ${cdm.done.length} de ${total} disputadas.`));

  // Por meses

  if(!months.includes(S.clasifMes)) S.clasifMes=months[months.length-1];
  const sel=h("select",{id:"sel-mes","aria-label":"Mes",style:"width:auto",onchange:e=>{S.clasifMes=e.target.value;clearDirty("sel-mes");render();}},
    months.map(m=>h("option",{value:m,selected:m===S.clasifMes},monthLabel(m))));
  const ms=standings(r=>r.race_date.slice(0,7)===S.clasifMes);
  box.append(h("div",{class:"row",style:"margin-top:0"}, sel, countLine(ms.done.length)));

function table(cols, list, keyFn, rowFn){

    out.replaceChildren("Contraseña temporal: ", h("strong",{style:"font-size:1.1rem;letter-spacing:.05em;color:var(--ink);user-select:all",text:pass}), h("br"),
      h("span",{class:"row",style:"margin-top:6px"},
        h("a",{class:"btn small",href:`mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(bodyTxt)}`},"Abrir correo"),
        h("button",{class:"btn ghost small",onclick:async ev=>{ try{ await navigator.clipboard.writeText(bodyTxt); ev.currentTarget.textContent="Mensaje copiado"; }catch(_){} }},"Copiar mensaje"),
        email?h("span",{class:"note",text:"Para: "+email}):null));
    return true;
  }
  const pwBox=h("div",{class:"card"},
    h("div",{class:"race-head"}, h("h3",{class:"race-name",style:"font-size:1.3rem"},"Contraseñas"),
      reqs.length?h("span",{class:"chip closed"},`${reqs.length} ${reqs.length===1?"petición":"peticiones"}`):null));
  if(reqs.length){
    pwBox.append(h("div",{class:"stack",style:"gap:10px;margin-top:10px"}, reqs.map(r=>{
      const out=h("div",{class:"note"});
      return h("div",{style:"border-top:1px solid var(--line);padding-top:10px"},
        h("div",{class:"row",style:"margin-top:0"},
          h("span",{class:"nm",style:"flex:1;min-width:0;overflow-wrap:anywhere"}, h("strong",{text:r.contact}), h("span",{class:"note"}," · "+fmtDT(r.created_at))),
          h("button",{class:"btn small",onclick:e=>doReset({email:r.contact},out,e.currentTarget)},"Nueva contraseña"),
          h("button",{class:"btn ghost small",onclick:async()=>{ const {error}=await sb.from("reset_requests").update({done:true}).eq("id",r.id);
            if(!error){ S.requests=S.requests.filter(x=>x.id!==r.id); render(); } }},"Hecho")),
        out);
    })));
  } else pwBox.append(h("p",{class:"note",style:"margin:4px 0 0"},"No hay peticiones pendientes."));
  // También a mano, eligiendo jugador
  const selP=h("select",{id:"rp-user","aria-label":"Jugador"}, h("option",{value:""},"Elige jugador…"),
    [...players].sort((a,b)=>a.alias.localeCompare(b.alias)).map(p=>h("option",{value:p.id},p.alias)));
  const pwOut=h("div",{class:"note",style:"margin-top:8px"});
  pwBox.append(h("details",{style:"margin-top:14px"}, h("summary",{},"Poner una contraseña a un jugador sin petición"),
    h("div",{class:"row"}, h("div",{style:"flex:1;min-width:160px"},selP),
      h("button",{class:"btn ghost",onclick:e=>{ if(!selP.value){ pwOut.className="note err"; pwOut.textContent="Elige un jugador."; return; } doReset({user_id:selP.value},pwOut,e.currentTarget); }},"Nueva contraseña")),
    pwOut));
  box.append(pwBox);

  // Avisos del Excel
  const recent=new Set(S.races.map(r=>r.id));
  const unm=S.unmatched.filter(u=>recent.has(u.race));
  box.append(h("div",{class:"card"}, h("h3",{class:"race-name",style:"font-size:1.3rem"},"Estado del Excel"),
    h("p",{class:"note",style:"margin:6px 0 0"}, `${S.riders.h.length} corredores y ${S.riders.m.length} corredoras para elegir. `,
      `Resultados encontrados en ${S.races.filter(r=>hasResult(r.id)).length} carreras de la Copa.`),
    unm.length ? h("div",{style:"margin-top:10px"}, h("p",{class:"note err",style:"margin:0"},"Sin equivalencia en Corredores (no puntúan hasta que los añadas):"),
      h("ul",{class:"note"}, unm.slice(0,30).map(u=>h("li",{text:`${u.name} · ${u.race} (${u.cat==="h"?"H":"M"})`})))) : h("p",{class:"note ok",style:"margin:6px 0 0"},"Todos los corredores de los resultados tienen equivalencia."),
    h("div",{class:"row"}, h("button",{class:"btn ghost",onclick:async e=>{ e.currentTarget.disabled=true; await refresh(); }},"Volver a leer el Excel"),
      h("button",{class:"btn ghost",onclick:syncCalendar},"Sincronizar calendario"), h("span",{class:"note",id:"sync-msg"}))));

  // Carreras: cierre y clase
  const list=[...S.races].sort((a,b)=>a.race_date.localeCompare(b.race_date));
  box.append(h("div",{class:"card"}, h("h3",{class:"race-name",style:"font-size:1.3rem"},"Carreras"),
    h("p",{class:"note",style:"margin:4px 0 6px"},"Cierre por defecto: el día de la carrera a las 13:30 (en Europeo y Mundial, el sábado). Cambia lo que necesites y pulsa Guardar en esa fila."),
    list.map(r=>{
      const id=r.id.replace(/[^\w-]/g,"_");
      const dt=h("input",{type:"datetime-local",id:`dl-${id}`,value:toLocalInput(r.deadline),"aria-label":`Cierre ${r.name}`});
      const cl=h("select",{id:`cl-${id}`,"aria-label":`Clase UCI ${r.name}`}, CLASSES.map(c=>h("option",{value:c,selected:c===r.uci_class},c)));
      const act=h("input",{type:"checkbox",id:`ac-${id}`,checked:r.active});
      const m=h("span",{class:"note"});
      return h("div",{class:"admrow"},
        h("div",{class:"nmcol",style:"min-width:0"}, h("strong",{text:r.name}), h("div",{class:"meta"}, fmtDay(r.race_date), hasResult(r.id)?" · con resultado":""),
          h("label",{class:"note",style:"display:inline-flex;gap:6px;align-items:center"}, act, "En juego")),
        dt, cl,
        h("div",{}, h("button",{class:"btn small",onclick:async()=>{
          const deadline=dt.value?new Date(dt.value).toISOString():null;
          const {error}=await sb.from("races").update({deadline, uci_class:cl.value, active:act.checked}).eq("id",r.id);
          if(error){ m.className="note err"; m.textContent="Error"; return; }
          Object.assign(r,{deadline,uci_class:cl.value,active:act.checked}); clearDirty(`dl-${id}`); clearDirty(`cl-${id}`);
          m.className="note ok"; m.textContent="✓";
        }},"Guardar"), m));
    })));

  // Escalas UCI
  const tas={}; const sm=h("span",{class:"note"});
  box.append(h("div",{class:"card"}, h("h3",{class:"race-name",style:"font-size:1.3rem"},"Puntos UCI por clase"),
    h("p",{class:"note",style:"margin:4px 0 0"},"Puntos del 1º, 2º, 3º… separados por comas. Las posiciones que no aparecen suman 0."),
    CLASSES.map(c=>{ tas[c]=h("textarea",{id:`sc-${c}`,"aria-label":`Escala ${c}`}); tas[c].value=(S.scales[c]||[]).join(", ");
      return h("div",{class:"field"}, h("label",{for:`sc-${c}`}, c), tas[c]); }),
    h("div",{class:"row"}, h("button",{class:"btn",onclick:async()=>{
      const value={}; for(const c of CLASSES) value[c]=tas[c].value.split(/[,;\s]+/).map(Number).filter(n=>!isNaN(n)&&n>=0);
      const {error}=await sb.from("settings").upsert({key:"uci_scales",value});
      if(error){ sm.className="note err"; sm.textContent="No se pudo guardar."; return; }
      S.scales=value; clearDirty("sc-"); sm.className="note ok"; sm.textContent="Escalas guardadas. Las clasificaciones ya usan los nuevos puntos.";
    }},"Guardar escalas"), sm)));
}

async function syncCalendar(){
  const m=document.getElementById("sync-msg"); m.className="note"; m.textContent="Leyendo la pestaña Carreras…";
  try{
    const {cols,rows}=await readTab(TABS.carreras);
    const ii=colIdx(cols,/ID_Carrera/i,0), id=colIdx(cols,/^fecha/i,1), is=colIdx(cols,/^serie/i,2), inn=colIdx(cols,/^nombre/i,3);
    const parse=s=>{ const x=(s||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); return x?`${x[3]}-${x[2].padStart(2,"0")}-${x[1].padStart(2,"0")}`:null; };
    const today=new Date().toISOString().slice(0,10);
    const known=new Map(S.races.map(r=>[r.id,r]));
    const inserts=[], updates=[];
    for(const r of rows){
      const rid=r[ii]; if(!rid || !rid.includes(SEASON)) continue;
      const date=parse(r[id]); if(!date) continue;
      const ex=known.get(rid);
      if(!ex){ if(date>=today){ const n=r[inn]||rid, s=r[is]||"";
        inserts.push({id:rid,name:n,series:s,race_date:date,uci_class:s==="Copa del Mundo"?"CDM":/europa/i.test(n)?"CE":/campeonato del mundo/i.test(n)?"CM":"C1"}); } }
      else if(ex.race_date!==date || ex.name!==(r[inn]||ex.name)) updates.push({id:rid, name:r[inn]||ex.name, race_date:date});
    }
    if(inserts.length){ const {error}=await sb.from("races").insert(inserts); if(error) throw error; }
    for(const u of updates){ const {error}=await sb.from("races").update({name:u.name, race_date:u.race_date}).eq("id",u.id); if(error) throw error; }
    m.className="note ok";
    m.textContent=`${inserts.length} carreras nuevas, ${updates.length} actualizadas.` + (updates.length?" Revisa el cierre de las que han cambiado de fecha.":"");
    await refresh();
  }catch(e){ m.className="note err"; m.textContent="No se pudo sincronizar: "+(e.message||e); }
}

// ---------- sugerencias de corredores (lista propia, igual en móvil y ordenador) ----------
const AC={el:null, input:null, items:[], idx:-1};
function acMatches(cat, q){
  const list=S.riders[cat]||[]; const nq=norm(q); if(!nq) return list.slice(0,40);
  const starts=[], inside=[];
  for(const n of list){ const nn=norm(n); const i=nn.indexOf(nq); if(i<0) continue;
    (i===0 || nn[i-1]===" " || nn[i-1]==="-") ? starts.push(n) : inside.push(n); }
  return starts.concat(inside).slice(0,40);
}
function acHighlight(name, q){
  const nq=norm(q), nn=norm(name), i=nq?nn.indexOf(nq):-1;
  if(i<0) return [document.createTextNode(name)];
  return [document.createTextNode(name.slice(0,i)), h("b",{},name.slice(i,i+nq.length)), document.createTextNode(name.slice(i+nq.length))];
}
function acClose(){ if(AC.el){ AC.el.remove(); AC.el=null; } if(AC.input) AC.input.setAttribute("aria-expanded","false"); AC.items=[]; AC.idx=-1; }
function acPick(name){
  const inp=AC.input; if(!inp) return;
  inp.value=name; dirty[inp.id]=name; acClose();
  // pasa a la siguiente casilla vacía de la misma tarjeta, o cierra el teclado
  const all=[...inp.closest("article")?.querySelectorAll("input[data-cat]")||[]];
  const next=all.slice(all.indexOf(inp)+1).find(x=>!x.value);
  if(next) next.focus(); else inp.blur();
}
function acOpen(inp){
  AC.input=inp; const q=inp.value;
  const taken=new Set([...(inp.closest("article")?.querySelectorAll(`input[data-cat="${inp.dataset.cat}"]`)||[])].filter(x=>x!==inp).map(x=>norm(x.value)).filter(Boolean));
  AC.items=acMatches(inp.dataset.cat, q).filter(n=>!taken.has(norm(n))); AC.idx=-1;
  if(!AC.el){ AC.el=h("ul",{class:"ac",role:"listbox",id:"ac-list"}); document.body.append(AC.el);
    // pointerdown para que la casilla no pierda el foco antes de elegir
    AC.el.addEventListener("pointerdown",e=>{ const li=e.target.closest("li[data-name]"); e.preventDefault(); if(li) acPick(li.dataset.name); }); }
  AC.el.replaceChildren(...(AC.items.length ? AC.items.map((n,i)=>h("li",{role:"option","data-name":n,"aria-selected":"false",id:"ac-"+i},...acHighlight(n,q)))
    : [h("li",{class:"none"}, S.riders[inp.dataset.cat]?.length ? "Ningún corredor coincide" : "Cargando lista de corredores…")]));
  const r=inp.getBoundingClientRect();
  Object.assign(AC.el.style,{left:(r.left+window.scrollX)+"px", top:(r.bottom+window.scrollY+4)+"px", width:r.width+"px"});
  inp.setAttribute("aria-expanded","true"); inp.setAttribute("aria-controls","ac-list");
}
function acMove(d){
  if(!AC.el||!AC.items.length) return;
  AC.idx=(AC.idx+d+AC.items.length)%AC.items.length;
  [...AC.el.children].forEach((li,i)=>li.setAttribute("aria-selected",String(i===AC.idx)));
  AC.el.children[AC.idx]?.scrollIntoView({block:"nearest"});
}
document.addEventListener("focusin",e=>{ const t=e.target;
  if(t.matches?.("input[data-cat]")){
    acOpen(t);
    // en móvil, sube la casilla para que la lista quepa por encima del teclado
    if(window.matchMedia("(max-width:640px)").matches) setTimeout(()=>{ t.scrollIntoView({block:"start",behavior:"smooth"}); setTimeout(()=>{ if(document.activeElement===t) acOpen(t); },350); },250);
  }});
document.addEventListener("input",e=>{ if(e.target.matches?.("input[data-cat]")) acOpen(e.target); });
document.addEventListener("focusout",e=>{ if(e.target===AC.input) setTimeout(()=>{ if(document.activeElement!==AC.input) acClose(); },120); });
document.addEventListener("keydown",e=>{
  if(!AC.el || e.target!==AC.input) return;
  if(e.key==="ArrowDown"){ e.preventDefault(); acMove(1); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); acMove(-1); }
  else if(e.key==="Enter" && AC.idx>=0){ e.preventDefault(); acPick(AC.items[AC.idx]); }
  else if(e.key==="Escape"){ acClose(); }
});
window.addEventListener("resize",()=>{ if(AC.el && AC.input && document.activeElement===AC.input) acOpen(AC.input); });

// ---------- arranque ----------
try{ const t=localStorage.getItem("cc-tab"); if(t) S.tab=t; }catch(e){}
if(configured){
  sb.auth.onAuthStateChange((_ev, session)=>{
    const changed=(S.session?.user?.id)!==(session?.user?.id);
    S.session=session;
    if(session && changed){ S.loaded=false; render(); refresh(); }
    else render();
  });
  // Refresca abierta/cerrada cada minuto (solo pinta, no escribe nada)
  setInterval(()=>{ if(S.session && S.tab==="carreras" && !document.activeElement?.matches?.("input,select,textarea")) render(); },60000);
}
render();
</script>
